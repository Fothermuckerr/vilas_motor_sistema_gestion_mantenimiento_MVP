{% extends 'base.html' %}

{% block title %}Crear orden de trabajo — Vilas Motor{% endblock %}

{% block content %}
<h1>Crear orden de trabajo</h1>
<p class="page-subtitle">Programar una mantención preventiva o correctiva.</p>

<form method="post" class="form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Crear</button>
    <a class="btn btn-secondary" href="{% url 'mantencion:ordenes_trabajo' %}">Cancelar</a>
</form>
{% endblock %}
