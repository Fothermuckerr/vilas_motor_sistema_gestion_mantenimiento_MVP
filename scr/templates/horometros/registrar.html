{% extends 'base.html' %}

{% block title %}Registrar lectura — Vilas Motor{% endblock %}

{% block content %}
<h1>Registrar lectura</h1>
<p class="page-subtitle">Reportar el horómetro de un equipo (no puede ser menor al actual).</p>

<form method="post" class="form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Registrar</button>
    <a class="btn btn-secondary" href="{% url 'horometros:lecturas' %}">Cancelar</a>
</form>
{% endblock %}
